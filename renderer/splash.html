<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MySkinArt</title>
<link rel="icon" type="image/png" href="../lib/logo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }

  .logo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: fadeIn 0.6s ease;
  }

  .logo-img {
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 20px rgba(20, 184, 166, 0.4));
  }

  .logo-text {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #f0fdfa;
  }

  .logo-text span {
    color: #14b8a6;
  }

  .loading-bar-container {
    width: 220px;
    height: 4px;
    background: #1e293b;
    border-radius: 2px;
    margin-top: 32px;
    overflow: hidden;
  }

  .loading-bar {
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, #0d9488, #14b8a6, #2dd4bf, #14b8a6, #0d9488);
    background-size: 200% 100%;
    border-radius: 2px;
    animation: slide 1.4s ease-in-out infinite;
  }

  .loading-text {
    margin-top: 14px;
    font-size: 12px;
    color: #64748b;
    letter-spacing: 1px;
  }

  @keyframes slide {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(350%); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="logo-container">
    <img class="logo-img" src="../lib/logo_nobg.png" alt="MySkinArt">
    <div class="logo-text">My<span>SkinArt</span></div>
  </div>
  <div class="loading-bar-container">
    <div class="loading-bar"></div>
  </div>
  <div class="loading-text">Loading...</div>
</body>
</html>
